<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kirish — Buxoro Suv Ta'minoti GIS</title>
<link rel="stylesheet" href="style.css">
<style>
  .login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(#0096c7,#48cae4)}
  .login-box{background:#fff;padding:40px 35px;border-radius:14px;box-shadow:0 10px 30px #0003;width:100%;max-width:360px}
  .login-box h2{margin:0 0 25px;color:#0077b6;text-align:center}
  .login-box input{width:100%;padding:12px;margin-bottom:14px;border:1px solid #ccd;border-radius:8px;box-sizing:border-box;font-size:15px}
  .login-box button{width:100%;padding:12px;background:#0077b6;color:#fff;border:none;border-radius:8px;font-weight:bold;font-size:15px;cursor:pointer}
  .login-box button:hover{background:#005f8a}
  .error-msg{color:#d00000;font-size:14px;margin-bottom:10px;min-height:18px;text-align:center}
</style>
</head>
<body>
<div class="login-wrap">
  <div class="login-box">
    <h2>💧 Tizimga kirish</h2>
    <div class="error-msg" id="errorMsg"></div>
    <input type="email" id="email" placeholder="Email" autocomplete="username">
    <input type="password" id="password" placeholder="Parol" autocomplete="current-password">
    <button id="loginBtn">Kirish</button>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="firebase-config.js"></script>
<script>
  const errorMsg = document.getElementById('errorMsg');
  const loginBtn = document.getElementById('loginBtn');

  // Agar allaqachon login qilingan bo'lsa, to'g'ridan-to'g'ri asosiy sahifaga o'tkazish
  auth.onAuthStateChanged(user => {
    if (user) window.location.href = 'index.html';
  });

  function doLogin() {
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    errorMsg.textContent = '';

    if (!email || !password) {
      errorMsg.textContent = 'Email va parolni kiriting';
      return;
    }

    loginBtn.disabled = true;
    loginBtn.textContent = 'Tekshirilmoqda...';

    auth.signInWithEmailAndPassword(email, password)
      .then(() => {
        window.location.href = 'index.html';
      })
      .catch(err => {
        loginBtn.disabled = false;
        loginBtn.textContent = 'Kirish';
        if (err.code === 'auth/invalid-credential' || err.code === 'auth/wrong-password' || err.code === 'auth/user-not-found') {
          errorMsg.textContent = 'Email yoki parol noto\'g\'ri';
        } else {
          errorMsg.textContent = 'Xatolik: ' + err.message;
        }
      });
  }

  loginBtn.addEventListener('click', doLogin);
  document.getElementById('password').addEventListener('keydown', e => {
    if (e.key === 'Enter') doLogin();
  });
</script>
</body>
</html>
